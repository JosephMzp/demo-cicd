# STAGING: un ambiente persistente, con datos similares a producción, al que solo se llega con aprobación.
# web se expone por NodePort 30080: en Rancher Desktop queda en http://localhost:30080
# prometheus queda en http://localhost:30090 y grafana en http://localhost:30030
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-staging

resources:
  - ../../base
  - prometheus.yaml
  - grafana.yaml

labels:
  - pairs:
      ambiente: staging
    includeSelectors: false

patches:
  - path: web-nodeport.yaml
  - path: api-replicas.yaml

images:
  - name: demo-cicd-web
    newName: ghcr.io/josephmzp/demo-cicd-web
    newTag: sha-73481ab9307c2be502bd13125fec149c6b2cff45
  - name: demo-cicd-api
    newName: ghcr.io/josephmzp/demo-cicd-api
    newTag: sha-73481ab9307c2be502bd13125fec149c6b2cff45
  - name: demo-cicd-db
    newName: ghcr.io/josephmzp/demo-cicd-db
    newTag: sha-73481ab9307c2be502bd13125fec149c6b2cff45