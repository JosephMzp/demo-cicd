version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directories: ["/web", "/api", "/db"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }