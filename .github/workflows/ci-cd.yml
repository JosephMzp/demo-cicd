name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: 1. Lint (ESLint, HTMLHint, Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run lint
      - name: Hadolint sobre los tres Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning
      - name: Resumen de Lint
        if: always()
        run: |
          echo "### 🧹 1. Resultado de Lint" >> "$GITHUB_STEP_SUMMARY"
          echo "- **ESLint (JS), HTMLHint (HTML) y Hadolint (Dockerfiles):** Ejecutados correctamente." >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: 2. SAST (Semgrep) y secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semgrep, análisis estático del código
        run: >
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.180.0
          semgrep scan --config p/ci --config p/dockerfile --error --metrics=off /src
      - name: TruffleHog, secretos en el historial de Git (Reemplazo B2)
        run: >
          docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.88.12
          git file:///repo --results=verified,unknown --fail --no-update
      - name: Resumen de SAST y Secretos
        if: always()
        run: |
          echo "### 🔍 2. SAST y Escaneo de Secretos" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SAST:** Semgrep \`1.180.0\` (reglas \`p/ci\` y \`p/dockerfile\`) ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Secretos (B2):** TruffleHog \`3.88.12\` sobre historial de Git ✅" >> "$GITHUB_STEP_SUMMARY"

  test-unit:
    name: 3. Pruebas unitarias y del sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run test:unit
      - run: npm run test:site
      - name: Resumen de Pruebas Unitarias
        if: always()
        run: |
          echo "### 🧪 3. Pruebas Unitarias y del Sitio Estático" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | Herramienta | Estado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unitarias API (\`tests/unit\`) | Vitest + Supertest | ✅ Pasaron |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sitio Estático (\`tests/site\`) | Vitest + jsdom | ✅ Pasaron |" >> "$GITHUB_STEP_SUMMARY"

  test-integration:
    name: 4. Pruebas de integración (Compose)
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Levantar la aplicación
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 12)" > .env
          docker compose up -d --build --wait
      - run: npm run test:integration
      - name: Resumen de Pruebas de Integración
        if: always()
        run: |
          echo "### 🔗 4. Pruebas de Integración (Docker Compose)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Servicios levantados:** \`web\`, \`api\`, \`db\` con healthchecks en verde ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Suite de integración (\`tests/integration\`):** ✅ Todas las pruebas pasaron" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v

  package:
    name: 5. Empaquetar y publicar (${{ matrix.servicio }})
    needs: [lint, test-integration, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [web, api, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/josephmzp/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.servicio }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  security:
    name: 6. Escaneo de imagen (${{ matrix.servicio }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read 
    strategy:
      matrix:
        servicio: [web, api, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/josephmzp/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      - name: Escaneo con Trivy (CRITICAL y HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
      - name: Escaneo de imagen con Grype (Herramienta B2)
        run: |
          docker run --rm \
            -v "$PWD/.grype.yaml:/.grype.yaml:ro" \
            -e GRYPE_REGISTRY_AUTH_AUTHORITY=ghcr.io \
            -e GRYPE_REGISTRY_AUTH_USERNAME="${{ github.actor }}" \
            -e GRYPE_REGISTRY_AUTH_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            anchore/grype:v0.87.0 \
            -c /.grype.yaml \
            "${{ env.IMAGEN }}:sha-${{ github.sha }}" --only-fixed --fail-on critical
      - name: Resumen de Seguridad (${{ matrix.servicio }})
        if: always()
        run: |
          echo "### 🛡️ 6. Escaneo de Imagen: \`${{ matrix.servicio }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Escáner | Severidad Bloqueante | Estado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trivy \`v0.36.0\`** | \`CRITICAL, HIGH\` (con parche) | ✅ 0 vulnerabilidades sin mitigar |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Grype \`v0.87.0\` (B2)** | \`CRITICAL\` (con parche) | ✅ 0 vulnerabilidades |" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Imagen auditada:** \`${{ env.IMAGEN }}:sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: 7. Deploy DEV (efímero) y smoke
    needs: security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: echo "PREFIJO=ghcr.io/josephmzp/demo-cicd" >> "$GITHUB_ENV"
      - name: Crear el clúster (kind)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: dev
      - name: Namespace y secretos
        run: |
          kubectl create namespace demo-dev
          kubectl -n demo-dev create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl -n demo-dev create secret generic db-credenciales --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
      - name: Desplegar
        run: scripts/desplegar.sh k8s/overlays/dev "$PREFIJO" "sha-${{ github.sha }}"
      - name: Esperar el rollout
        run: |
          kubectl -n demo-dev rollout status deploy/db  --timeout=180s
          kubectl -n demo-dev rollout status deploy/api --timeout=180s
          kubectl -n demo-dev rollout status deploy/web --timeout=180s
      - name: Smoke test y pruebas de integración contra DEV
        run: |
          kubectl -n demo-dev port-forward svc/web 8080:80 &
          sleep 3
          bash scripts/smoke.sh http://localhost:8080
          APP_URL=http://localhost:8080 npm run test:integration
          
      - name: DAST con OWASP ZAP Baseline contra DEV (Reto 1)
        run: |
          mkdir -p zap-reports && chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            -v "$PWD/.zap/rules.tsv:/zap/wrk/rules.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t http://localhost:8080 \
            -c rules.tsv \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -I
      - name: Subir reporte de OWASP ZAP como artefacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owasp-zap-dast-report
          path: |
            zap-reports/zap-report.html
            zap-reports/zap-report.json
            zap-reports/zap-report.md
          retention-days: 14
      - name: Resumen de DEV
        if: always()
        run: |
          echo "### ⎈ 7. Verificación en DEV Efímero (kind)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Smoke test (5 comprobaciones) + Integración:** ✅ Todo en verde para \`sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnóstico (solo si algo falló)
        if: failure()
        run: |
          kubectl -n demo-dev get all
          kubectl -n demo-dev describe pods
          kubectl -n demo-dev logs -l app=api --tail=50 || true
          kubectl -n demo-dev logs -l app=db  --tail=50 || true

  deploy-staging:
    name: 8. Deploy STAGING (con aprobación - GitOps Argo CD)
    needs: deploy-dev
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: self-hosted
    environment:
      name: staging
      url: http://localhost:30080
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Actualizar tag de imágenes en overlay staging (GitOps)
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i -E "s/newTag: sha-.*/newTag: sha-${COMMIT_SHA}/g" k8s/overlays/staging/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(gitops): promover sha-${COMMIT_SHA} a staging [skip ci]"
          git push origin HEAD:main
      - name: Sincronizar Argo CD y verificar rollout en el clúster
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          kubectl apply -f k8s/argocd-staging-app.yaml
          # Forzar refresh en Argo CD para no esperar los 3 minutos de polling por defecto
          kubectl -n argocd annotate application demo-cicd-staging argocd.argoproj.io/refresh=normal --overwrite
          sleep 5
          kubectl -n demo-staging rollout status deploy/db  --timeout=180s
          kubectl -n demo-staging rollout status deploy/api --timeout=180s
          kubectl -n demo-staging rollout status deploy/web --timeout=180s
      - name: Smoke test contra STAGING
        run: bash scripts/smoke.sh http://localhost:30080