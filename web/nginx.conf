# nginx sirve la página y reenvía /api/ al backend.
# Escucha en 8080 porque la imagen corre sin root (nginx-unprivileged), y sin root no se puede usar el puerto 80.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (Mitigación DAST - Reto 1 OWASP ZAP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;

    location /api/ {
        # URL quemada (hardcoded) para evitar el crash (emerg host not found) en Render
        proxy_pass https://demo-cicd-api-sha-gbox.onrender.com;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }

    # Las métricas de la API son para Prometheus, no para Internet.
    location /metrics {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}