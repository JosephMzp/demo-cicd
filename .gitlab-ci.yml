stages:
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"

lint-and-unit-tests:
  stage: test
  image: node:22-alpine
  script:
    - npm ci --ignore-scripts
    - npm ci --prefix api --ignore-scripts
    - npm run lint
    - npm run test:unit
    - npm run test:site

build-images:
  stage: build
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  parallel:
    matrix:
      - SERVICIO: [web, api, db]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - rm -rf "./$SERVICIO/node_modules"
    - IMAGEN="$CI_REGISTRY_IMAGE/demo-cicd-$SERVICIO:sha-$CI_COMMIT_SHORT_SHA"
    - docker build --network host -t "$IMAGEN" "./$SERVICIO"
    - docker push "$IMAGEN"

deploy-staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - build-images
  when: manual
  allow_failure: false
  script:
    - "echo 'Despliegue a staging aprobado exitosamente'"